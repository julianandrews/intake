[package]
name = "intake"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "=4.6.5", features = ["derive", "unstable-ext"] }
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
anyhow = "1"
anstyle-query = "1.1.5"
dirs = "6"
intake-ai = { path = "crates/intake-ai", optional = true }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde_json = { version = "1", optional = true }
similar = { version = "2", optional = true }
tempfile = "3"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"], optional = true }

[features]
default = ["ai"]
ai = ["dep:intake-ai", "dep:serde_json", "dep:similar", "dep:ureq"]

[workspace]
resolver = "2"
members = [".", "crates/intake-ai"]

[[test]]
name = "ai"
required-features = ["ai"]
