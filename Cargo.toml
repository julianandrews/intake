[package]
name = "intake"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tempfile = "3"
